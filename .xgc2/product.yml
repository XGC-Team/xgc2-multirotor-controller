schema: xgc2.product.v1
id: xgc2-multirotor-controller
name: XGC2 Multirotor Controller
version: 1.1.18-6
kind: ros1-apt
summary: ROS1 PX4 multirotor controller and multirotor reference trajectory packages
  for XGC2 robots.
ros:
  distro: noetic
  packages:
  - multirotor_reference_trajectory
  - px4_multirotor_controller
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-multirotor-controller
  packages:
  - ros-noetic-xgc2-multirotor-controller
  depends:
  - libeigen3-dev
  - libxgc2-state-machine-dev (>= 0.1.3-4~focal)
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - xgc2-acados (>= 0.1.0-10~focal)
  - ros-noetic-xgc2-ros1-utils (>= 1.1.1-3)
  - ros-noetic-xgc2-estimator-hover-thrust-msgs (>= 1.2.0-3)
  - ros-noetic-xgc2-estimator-rigid-state-msgs (>= 1.2.0-3)
  - ros-noetic-xgc2-multirotor-reference-trajectory-msgs (>= 1.2.0-3)
  - ros-noetic-xgc2-px4-multirotor-controller-msgs (>= 1.2.0-3)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-multirotor-controller

    '
  smoke_test: 'roslaunch --files multirotor_reference_trajectory uav_multirotor_reference_trajectory.launch

    roslaunch --files px4_multirotor_controller uav_nmpc_controller.launch

    '
ownership:
  paths:
  - /opt/ros/noetic/share/multirotor_reference_trajectory
  - /opt/ros/noetic/share/px4_multirotor_controller
  - /opt/ros/noetic/include/multirotor_reference_trajectory
  - /opt/ros/noetic/include/px4_multirotor_controller
  - /opt/ros/noetic/lib/multirotor_reference_trajectory
  - /opt/ros/noetic/lib/px4_multirotor_controller
  - /opt/ros/noetic/lib/libpx4_multirotor_controller_uav_nmpc_runtime.so
release:
  dependency_policy:
    libxgc2-math-dev: rebuild
    libxgc2-state-machine-dev: rebuild
    xgc2-acados: rebuild
    xgc2-ros-msgs: rebuild
    xgc2-ros1-utils: rebuild
  apt_versions:
    focal: 1.1.18-6
