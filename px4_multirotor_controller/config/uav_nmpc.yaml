tracking_backend: px4_local
local_type_mask: 3072

dfbc:
  position_natural_frequency: [2.0, 2.0, 2.2]
  position_damping_ratio: [0.9, 0.9, 1.0]
  tilt_gain: 6.0
  tilt_rate_damping: 1.0
  yaw_gain: 0.3
  yaw_rate_damping: 0.2
  use_body_rate_feedforward: true
  acceleration_correction_enabled: true
  acceleration_correction_gain: [0.35, 0.35, 0.0]
  acceleration_correction_limit: [2.0, 2.0, 0.0]
  acceleration_correction_filter_tau: 0.0
  acceleration_measurement_timeout: 0.05
  log_period: 1.0

nmpc:
  control_period: 0.01
  prediction_horizon: 1.0
  body_rate_time_constant: 0.08
  gravity: 9.8066
  hover_thrust_ratio: 0.5
  min_hover_thrust: 0.05
  max_hover_thrust: 0.95
  normalized_thrust_min: 0.1
  normalized_thrust_max: 0.9
  max_roll_pitch_body_rate: 3.4906585
  max_yaw_body_rate: 0.8726646
  max_roll_pitch_angular_acceleration: 15.0
  max_yaw_angular_acceleration: 2.0
  # Simulation starting point. W * alpha_max^2 matches the UGV baseline (9).
  # Do not present these values as flight-identified before physical bags exist.
  angular_acceleration_weight: [0.04, 0.04, 2.25]
  solve_timeout: 0.03
  result_timeout: 0.1
  reference_timeout: 0.5
  reference_start_delay: 0.2
  reference_duration: 60.0
  reference_radius: 3.0
  reference_line_speed: 1.0
  reference_height: 3.0
  reference_z_amplitude: 0.0
  reference_z_frequency: 0.5
  reference_entry_duration: 5.0
  reference_analytic_type: 9
  reference_torus_omega: 0.3
  reference_torus_scale: 2.0
  enable_timing_log: true
  log_period: 1.0

hover_thrust:
  enabled: true
  timeout: 0.5
  min_altitude: 0.5
  sample_timeout: 0.2
  publish_rate: 50.0
